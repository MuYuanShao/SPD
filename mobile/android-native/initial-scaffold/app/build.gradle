plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android { namespace 'com.hospital.spd.mobile'; compileSdk 35
  defaultConfig { applicationId 'com.hospital.spd.mobile'; minSdk 29; targetSdk 35; versionCode 1; versionName '1.0.0' }
  buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}
dependencies {
  implementation project(':capacitor-android')
  implementation 'androidx.room:room-runtime:2.7.0'
  implementation 'androidx.room:room-ktx:2.7.0'
  implementation 'androidx.work:work-runtime-ktx:2.10.1'
  implementation 'androidx.camera:camera-camera2:1.4.2'
  implementation 'androidx.camera:camera-lifecycle:1.4.2'
  implementation 'androidx.camera:camera-view:1.4.2'
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
