map "$request_method:$uri" $spd_password_change_key {
    default "";
    ~^PUT:/api/auth/password/?$ $binary_remote_addr;
}

limit_req_zone $spd_password_change_key zone=spd_password_change:1m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location /api/ {
        limit_req zone=spd_password_change burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:1818/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
    }
    location = /mobile { return 302 /mobile/; }
    location /mobile/ { try_files $uri $uri/ /mobile/index.html; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location / { try_files $uri $uri/ /index.html; }
}
