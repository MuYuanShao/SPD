server:
  port: 1818
  servlet:
    context-path: /api

spring:
  application:
    name: hospital-spd
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    url: ${SPD_DB_URL}
    username: ${SPD_DB_USERNAME}
    password: ${SPD_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

spd:
  mobile:
    # Keep the new mobile API fail-closed until the hospital supplies a stable server id and secret.
    enabled: ${SPD_MOBILE_ENABLED:false}
    server-id: ${SPD_MOBILE_SERVER_ID:}
    review-secret: ${SPD_MOBILE_REVIEW_SECRET:}
  jobs:
    zone: Asia/Shanghai
    inventory-summary:
      cron: "0 0 0 * * *"
    daily-quota:
      cron: "0 5 0 * * *"
      history-months: 12
  cors:
    allowed-origins:
      - http://localhost:1820
      - http://127.0.0.1:1820
  upload:
    dir: ${SPD_UPLOAD_DIR:./output/license-files}
  jwt:
    secret: ${SPD_JWT_SECRET}
    expiration-ms: ${SPD_JWT_EXPIRATION:86400000}
