name: ${COMPOSE_PROJECT_NAME:-hospital-spd}

x-backend-image: &backend-image
  image: hospital-spd/backend:${SPD_IMAGE_TAG:-20261020}
  build:
    context: ..
    dockerfile: Dockerfile
    target: backend
  pull_policy: never

x-database-url: &database-url jdbc:mysql://mysql:3306/${SPD_DB_NAME:-ISPD}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false

services:
  mysql:
    image: hospital-spd/mysql:${SPD_IMAGE_TAG:-20261020}
    build:
      context: ..
      dockerfile: Dockerfile
      target: mysql
    pull_policy: never
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${SPD_DB_NAME:-ISPD}
      MYSQL_USER: ${SPD_FLYWAY_USERNAME:-spd_migrate}
      MYSQL_PASSWORD: ${SPD_FLYWAY_PASSWORD:?Run deploy/start.ps1 or deploy/start.sh to initialize secrets}
      MYSQL_ROOT_PASSWORD: ${SPD_DB_ROOT_PASSWORD:?SPD_DB_ROOT_PASSWORD is required}
      MYSQL_RUNTIME_USER: ${SPD_DB_USERNAME:-spd_runtime}
      MYSQL_RUNTIME_PASSWORD: ${SPD_DB_PASSWORD:?SPD_DB_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - spd-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=TCP -h127.0.0.1 -uroot --connect-timeout=3 -Nse 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    logging: &bounded-logs
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  database-accounts:
    image: hospital-spd/mysql:${SPD_IMAGE_TAG:-20261020}
    pull_policy: never
    restart: "no"
    entrypoint: [/usr/local/bin/spd-ensure-accounts.sh]
    environment:
      MYSQL_DATABASE: ${SPD_DB_NAME:-ISPD}
      MYSQL_ROOT_PASSWORD: ${SPD_DB_ROOT_PASSWORD:?SPD_DB_ROOT_PASSWORD is required}
      MYSQL_USER: ${SPD_FLYWAY_USERNAME:-spd_migrate}
      MYSQL_PASSWORD: ${SPD_FLYWAY_PASSWORD:?SPD_FLYWAY_PASSWORD is required}
      MYSQL_RUNTIME_USER: ${SPD_DB_USERNAME:-spd_runtime}
      MYSQL_RUNTIME_PASSWORD: ${SPD_DB_PASSWORD:?SPD_DB_PASSWORD is required}
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck: {disable: true}
    logging: *bounded-logs

  migrate:
    <<: *backend-image
    restart: "no"
    init: true
    environment:
      SPD_DB_URL: *database-url
      SPD_FLYWAY_USERNAME: ${SPD_FLYWAY_USERNAME:-spd_migrate}
      SPD_FLYWAY_PASSWORD: ${SPD_FLYWAY_PASSWORD:?SPD_FLYWAY_PASSWORD is required}
    command: ["--spd.command=migrate"]
    depends_on:
      mysql: {condition: service_healthy}
      database-accounts: {condition: service_completed_successfully}
    healthcheck: {disable: true}
    logging: *bounded-logs

  bootstrap:
    <<: *backend-image
    restart: "no"
    init: true
    environment:
      SPD_DB_URL: *database-url
      SPD_FLYWAY_USERNAME: ${SPD_FLYWAY_USERNAME:-spd_migrate}
      SPD_FLYWAY_PASSWORD: ${SPD_FLYWAY_PASSWORD:?SPD_FLYWAY_PASSWORD is required}
      SPD_INITIAL_ADMIN_PASSWORD: ${SPD_INITIAL_ADMIN_PASSWORD:?SPD_INITIAL_ADMIN_PASSWORD is required}
    command: ["--spd.command=bootstrap-admin"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck: {disable: true}
    logging: *bounded-logs

  backend:
    <<: *backend-image
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_FLYWAY_ENABLED: "false"
      SPD_DB_URL: *database-url
      SPD_DB_USERNAME: ${SPD_DB_USERNAME:-spd_runtime}
      SPD_DB_PASSWORD: ${SPD_DB_PASSWORD:?SPD_DB_PASSWORD is required}
      # validate命令复用现有命名，实际传入运行账号，禁止其拥有DDL权限。
      SPD_FLYWAY_USERNAME: ${SPD_DB_USERNAME:-spd_runtime}
      SPD_FLYWAY_PASSWORD: ${SPD_DB_PASSWORD:?SPD_DB_PASSWORD is required}
      SPD_REQUIRE_NO_DDL: "true"
      SPD_JWT_SECRET: ${SPD_JWT_SECRET:?SPD_JWT_SECRET is required}
      SPD_JWT_EXPIRATION: ${SPD_JWT_EXPIRATION:-86400000}
      SPD_UPLOAD_DIR: /app/output/license-files
      SPD_CORS_ALLOWED_ORIGINS: ${SPD_CORS_ALLOWED_ORIGINS:-http://localhost:1820,http://127.0.0.1:1820}
      SPD_MOBILE_ENABLED: ${SPD_MOBILE_ENABLED:-false}
      SPD_MOBILE_SERVER_ID: ${SPD_MOBILE_SERVER_ID:-}
      SPD_MOBILE_REVIEW_SECRET: ${SPD_MOBILE_REVIEW_SECRET:-}
      SPD_AI_BASE_URL: ${SPD_AI_BASE_URL:-http://ollama:11434}
      SPD_AI_MODEL: ${SPD_AI_MODEL:-qwen3-vl:8b}
      SPD_AI_TIMEOUT_MS: ${SPD_AI_TIMEOUT_MS:-120000}
      SPD_MCP_ENABLED: ${SPD_MCP_ENABLED:-false}
      SPD_MCP_UPLOAD_ENABLED: ${SPD_MCP_UPLOAD_ENABLED:-false}
      SPD_MCP_PHASE2_UPLOAD_ENABLED: ${SPD_MCP_PHASE2_UPLOAD_ENABLED:-false}
      SPD_MCP_ORGANIZATION: ${SPD_MCP_ORGANIZATION:-}
      SPD_MCP_SHARED_TOKEN: ${SPD_MCP_SHARED_TOKEN:-}
      SPD_MCP_OPERATOR_ID: ${SPD_MCP_OPERATOR_ID:-0}
      SPD_MCP_UI_URL: ${SPD_MCP_UI_URL:-}
      SPD_MCP_UI_INSTANCE_ID: ${SPD_MCP_UI_INSTANCE_ID:-}
      SPD_MCP_UI_TENANT_ID: ${SPD_MCP_UI_TENANT_ID:-1}
      SPD_MCP_UI_USERNAME: ${SPD_MCP_UI_USERNAME:-}
      SPD_MCP_UI_PASSWORD: ${SPD_MCP_UI_PASSWORD:-}
      SPD_MCP_UI_API_KEY: ${SPD_MCP_UI_API_KEY:-}
      SPD_MCP_CURRENCY: ${SPD_MCP_CURRENCY:-}
      SPD_MCP_TAX_INCLUDED: ${SPD_MCP_TAX_INCLUDED:-}
      SPD_MCP_SOURCE_ZONE: ${SPD_MCP_SOURCE_ZONE:-Asia/Shanghai}
    volumes:
      - spd-application-data:/app/output
      - spd-application-logs:/app/logs
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      ollama-init: {condition: service_completed_successfully, required: false}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1818/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 16
      start_period: 45s
    logging: *bounded-logs

  frontend:
    image: hospital-spd/web:${SPD_IMAGE_TAG:-20261020}
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${SPD_HTTP_PORT:-1820}:80"
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
    logging: *bounded-logs

  ollama:
    image: ${SPD_OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - spd-ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    logging: *bounded-logs

  ollama-init:
    image: ${SPD_OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: [ai]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      SPD_AI_MODEL: ${SPD_AI_MODEL:-qwen3-vl:8b}
      SPD_OFFLINE: ${SPD_OFFLINE:-false}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        if ollama show "$${SPD_AI_MODEL}" >/dev/null 2>&1; then exit 0; fi
        if [ "$${SPD_OFFLINE}" = true ]; then echo 'Offline model is missing; include models.tar in the bundle' >&2; exit 1; fi
        exec ollama pull "$${SPD_AI_MODEL}"
    depends_on:
      ollama: {condition: service_healthy}
    healthcheck: {disable: true}
    logging: *bounded-logs

volumes:
  spd-mysql-data:
    name: ${SPD_MYSQL_VOLUME:-${COMPOSE_PROJECT_NAME:-hospital-spd}_spd-mysql-data}
  spd-application-data:
  spd-application-logs:
  spd-ollama-models:
    name: ${COMPOSE_PROJECT_NAME:-hospital-spd}-ollama-models
