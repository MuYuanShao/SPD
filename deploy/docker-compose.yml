services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${SPD_DB_NAME:-ISPD}
      MYSQL_USER: ${SPD_DB_USERNAME:?SPD_DB_USERNAME is required}
      MYSQL_PASSWORD: ${SPD_DB_PASSWORD:?SPD_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${SPD_DB_ROOT_PASSWORD:?SPD_DB_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - spd-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      SPD_DB_URL: jdbc:mysql://mysql:3306/${SPD_DB_NAME:-ISPD}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPD_DB_USERNAME: ${SPD_DB_USERNAME:?SPD_DB_USERNAME is required}
      SPD_DB_PASSWORD: ${SPD_DB_PASSWORD:?SPD_DB_PASSWORD is required}
      SPD_JWT_SECRET: ${SPD_JWT_SECRET:?SPD_JWT_SECRET is required}
      SPD_JWT_EXPIRATION: ${SPD_JWT_EXPIRATION:-86400000}
      SPD_MCP_ENABLED: ${SPD_MCP_ENABLED:-false}
      SPD_MCP_UPLOAD_ENABLED: ${SPD_MCP_UPLOAD_ENABLED:-false}
      SPD_MCP_PHASE2_UPLOAD_ENABLED: ${SPD_MCP_PHASE2_UPLOAD_ENABLED:-false}
      SPD_MCP_ORGANIZATION: ${SPD_MCP_ORGANIZATION:-}
      SPD_MCP_SHARED_TOKEN: ${SPD_MCP_SHARED_TOKEN:-}
      SPD_MCP_OPERATOR_ID: ${SPD_MCP_OPERATOR_ID:-0}
      SPD_MCP_UI_URL: ${SPD_MCP_UI_URL:-}
      SPD_MCP_UI_INSTANCE_ID: ${SPD_MCP_UI_INSTANCE_ID:-}
      SPD_MCP_UI_TENANT_ID: ${SPD_MCP_UI_TENANT_ID:-1}
      SPD_MCP_UI_USERNAME: ${SPD_MCP_UI_USERNAME:-}
      SPD_MCP_UI_PASSWORD: ${SPD_MCP_UI_PASSWORD:-}
      SPD_MCP_UI_API_KEY: ${SPD_MCP_UI_API_KEY:-}
      SPD_MCP_CURRENCY: ${SPD_MCP_CURRENCY:-}
      SPD_MCP_TAX_INCLUDED: ${SPD_MCP_TAX_INCLUDED:-}
      SPD_MCP_SOURCE_ZONE: ${SPD_MCP_SOURCE_ZONE:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1818/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "${SPD_HTTP_PORT:-1820}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  spd-mysql-data:
